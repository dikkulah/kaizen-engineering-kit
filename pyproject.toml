[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaizen-engineering-kit"
version = "4.0.0"
description = "Kaizen v4.0 Closed-Loop AI Engineering Kit: Deterministic AST & Clean Code Gates, Multi-Model FinOps Routing, Hybrid Code RAG, Execution-Oracle QLoRA Synthesis, and Refactor Radar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = [
    "ai-engineering",
    "clean-code",
    "ast-gates",
    "qlora",
    "finops",
    "mcp",
    "code-rag",
    "refactoring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/kaizen-kit/kaizen-engineering-kit"
Repository = "https://github.com/kaizen-kit/kaizen-engineering-kit"
Issues = "https://github.com/kaizen-kit/kaizen-engineering-kit/issues"

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]
claude-sdk = ["claude-agent-sdk>=0.2.180"]
mcp = ["fastmcp>=4.1.0", "httpx>=0.27.0"]
adk = ["google-adk[mcp]>=2.14.0"]
sdk = ["boto3>=1.34.0", "claude-agent-sdk>=0.2.180", "google-genai>=1.0.0"]
radar = [
    "duckdb>=1.1.0",
    "lancedb>=0.15.0",
    "pyarrow>=18.0.0",
    "numpy>=1.26.0",
    "networkx>=3.4",
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "typer>=0.13.0",
    "boto3>=1.34.0",
]
qlora = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.0",
    "datasets>=3.0.0",
]

[project.scripts]
kaizen-kit = "kaizen_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaizen_kit = ["assets/**/*"]
